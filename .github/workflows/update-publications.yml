name: Discover New Publications

on:
  schedule:
    - cron: "17 9 * * 4" # Every Thursday 09:17 UTC
  workflow_dispatch:

jobs:
  discover-publications:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install requests

      - name: Discover and propose new publications
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_publications.py --pr

      - name: Report failure
        if: failure()
        uses: ./.github/actions/report-failure
        with:
          title: "Publication discovery is failing"
          token: ${{ secrets.GITHUB_TOKEN }}
          guidance: |
            Likely causes:

            - **ORCID unreachable or schema changed** — the works endpoint is parsed
              defensively, so a hard failure means the request itself failed.
            - **Semantic Scholar 429** — its keyless endpoint is heavily throttled;
              already retried with backoff.
            - **`gh pr create` failed** — a branch for these entries may already exist.
