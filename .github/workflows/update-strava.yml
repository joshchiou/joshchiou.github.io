name: Update Strava Data

on:
  schedule:
    - cron: "0 6 * * *" # Daily at 06:00 UTC
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

jobs:
  update-strava:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch and update Strava data
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: python scripts/update_strava.py

      - name: Commit updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/strava_calendar.json _data/strava_stats.json _data/strava_rides.json
          git diff --staged --quiet || git commit -m "chore: update Strava activity data"
          git push

      - name: Report failure
        if: failure()
        uses: ./.github/actions/report-failure
        with:
          title: "Strava sync is failing"
          token: ${{ secrets.GITHUB_TOKEN }}
          guidance: |
            Read the 403 body in the log before acting — these look identical from
            the status code alone, and the token refresh succeeds in every case.

            - **Developer Program subscription lapsed.** Since 30 June 2026 Strava
              requires a paid subscription (~$11.99/month) for Standard tier API
              access. Personal single-user apps are Standard tier. This is the most
              likely cause of a 403 that appears without any code change.
            - **403 naming `activity:read_permission` as `missing`** — the token
              lacks the `activity:read_all` scope. Re-authorize and update the
              `STRAVA_REFRESH_TOKEN` secret.
            - **401** — the refresh token was revoked; re-authorize.
            - **429 / rate limit** — transient, and already retried.

            If the subscription is the cause and you don't want to pay, the site can
            run on the Apple Health backfill alone: keep `_data/health_rides.json`
            up to date with `scripts/parse_apple_health.py` and disable this
            workflow.
