name: Update Strava Data

on:
  schedule:
    - cron: "0 6 * * *" # Daily at 06:00 UTC
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

jobs:
  update-strava:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch and update Strava data
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: python scripts/update_strava.py

      - name: Commit updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/strava_calendar.json _data/strava_stats.json _data/strava_rides.json
          git diff --staged --quiet || git commit -m "chore: update Strava activity data"
          git push

      # A scheduled job that fails quietly can stay broken for weeks (this one
      # failed 23 days running in July 2026 before anyone noticed). Raise a
      # single tracking issue so the breakage is visible, and don't reopen or
      # re-comment while that issue is still open.
      - name: Open an issue if the sync failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "Strava sync is failing"
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          open_issue=$(gh issue list --state open --search "$TITLE in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$open_issue" ]; then
            echo "Issue #$open_issue is already tracking this failure; not commenting."
            exit 0
          fi
          gh issue create --title "$TITLE" --body "$(cat <<EOF
          The scheduled Strava sync failed. The site is now serving stale ride data.

          **Failed run:** $RUN_URL

          The run log names the reason the Strava API gave. Common causes:

          - **403 with \`activity:read_permission\` \`missing\`** — the refresh token
            lacks the \`activity:read_all\` scope. Re-authorize the app with that
            scope and update the \`STRAVA_REFRESH_TOKEN\` secret.
          - **401** — the refresh token was revoked; re-authorize.
          - **429 / rate limit** — transient; the script already retries.

          Close this issue once the sync succeeds again.
          EOF
          )"
