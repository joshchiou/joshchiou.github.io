# Temporary: downloads paper figures and gallery photos for review.
# Lives only on the claude/figure-fetch branch; never merged.
name: Fetch figure candidates

on:
  push:
    branches: [claude/figure-fetch]

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install requests pyyaml
      - name: Download
        run: python3 scratch_fetch.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scratch-figures
          git commit -m "Add figure candidates" || echo "nothing to commit"
          git push
