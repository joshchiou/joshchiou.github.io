name: Site checks

# Builds the site and checks that every number it shows (publication counts, Scholar stats,
# GitHub, travel, and cycling stats) matches its source file and agrees across pages, that every
# CDN integrity hash matches its file, and (in headless Chromium) that every page runs without
# errors and the interactive features work. The number check also runs in deploy.yml before
# anything goes live. The weekly run catches breakage from data refreshes, which push without
# triggering this workflow.

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main
  schedule:
    - cron: "41 8 * * 1" # Mondays 08:41 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Setup Python 🐍
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Python dependencies
        run: pip install pytest pyyaml nbconvert playwright
      - name: Check data files 🔢
        run: python3 scripts/check_site.py
      - name: Check CDN integrity hashes 🔒
        run: python3 scripts/check_sri.py --strict
      - name: Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          JEKYLL_ENV=production bundle exec jekyll build --strict_front_matter
      - name: Check numbers on the built site 🔢
        run: python3 scripts/check_site.py --site _site
      - name: Purge unused CSS, as the deploy does 🧹
        run: npx --yes purgecss@8 -c purgecss.config.js
      - name: Install Chromium 🌐
        run: python3 -m playwright install --with-deps chromium
      - name: Run tests, including browser tests 🧪
        run: python3 -m pytest tests -v
