name: Update GitHub Stats

on:
  schedule:
    - cron: "41 8 * * 2" # Every Tuesday 08:41 UTC
  workflow_dispatch:

jobs:
  update-github:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Fetch and update GitHub stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_github.py

      - name: Commit updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/github_stats.json
          git diff --staged --quiet || git commit -m "chore: update GitHub stats"
          git push

      - name: Report failure
        if: failure()
        uses: ./.github/actions/report-failure
        with:
          title: "GitHub stats sync is failing"
          token: ${{ secrets.GITHUB_TOKEN }}
          guidance: |
            Likely causes:

            - **403 with `X-RateLimit-Remaining: 0`** — quota exhausted; already
              retried with backoff.
            - **404 on a featured repo** — it was renamed, made private, or deleted.
              Fix the slug in `_data/repositories.yml`.

            Previous stats are preserved on failure, so the site keeps the last known
            good values rather than showing zeros.
