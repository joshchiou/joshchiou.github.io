name: Update Scholar Stats

on:
  schedule:
    - cron: "23 7 * * 3" # Every Wednesday 07:23 UTC
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

jobs:
  update-scholar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install scholarly

      - name: Fetch and update Scholar stats
        run: python scripts/update_scholar.py

      - name: Commit updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/scholar_stats.json
          git diff --staged --quiet || git commit -m "chore: update scholar stats [skip ci]"
          git push

      # Runs after the commit on purpose: a stale citation count shouldn't stop
      # the paper count (which is read from papers.bib and always current) from
      # being published. This step only decides whether to raise the alarm.
      # 35 days, not 28: the scraper genuinely fails about half the time, and the
      # longest observed gap between two confirmed-successful fetches (measured
      # from citation changes in git history, May-Jul 2026) was 21 days. A
      # threshold too close to that would page on normal intermittency.
      - name: Fail if Scholar data has gone stale
        run: python scripts/update_scholar.py --check-freshness 35

      - name: Report failure
        if: failure()
        uses: ./.github/actions/report-failure
        with:
          title: "Scholar stats have been stale for weeks"
          token: ${{ secrets.GITHUB_TOKEN }}
          guidance: |
            Google Scholar is scraped rather than an API, so intermittent blocking is
            normal and the script preserves the last known good citation counts. This
            issue means the fetch has not succeeded for a long time (see
            `last_success_at` in `_data/scholar_stats.json`), so the displayed citation
            count and h-index are drifting further out of date.
