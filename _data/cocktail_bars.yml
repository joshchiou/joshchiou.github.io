# Bars on the cocktails page (_projects/fun_cocktails.md), Boston area first.
# Fields: name, city (shown as the chip), area (neighborhood or street), note, map (search query
# for a Google Maps link). Notes are one or two plain sentences; say what was good, not ratings.
- name: Wusong Road
  city: Cambridge
  area: Harvard Square
  note: >-
    Chef Jason Doo's tiki bar over two floors, inspired by his family's American Chinese
    restaurant.
  map: Wusong Road, 112 Mt Auburn St, Cambridge, MA

- name: Longfellow Bar
  city: Cambridge
  area: Harvard Square
  note: >-
    The upstairs bar at Alden & Harlow, in the old Café Algiers space, with a cocktail list that
    changes often.
  map: Longfellow Bar, 40 Brattle St, Cambridge, MA

- name: Blossom Bar
  city: Brookline
  area: Brookline Village
  note: >-
    Ran Duan's tropical cocktails, built on Latin American spirits, in his family's former Sichuan
    Garden space.
  map: Blossom Bar, 295 Washington St, Brookline, MA

- name: Bloom
  city: Boston
  area: Seaport
  note: >-
    A Japanese tea and cocktail bar: matcha during the day, cocktails at night.
  map: Bloom Tea & Cocktail Bar, 60 Seaport Blvd, Boston, MA

- name: Little Red Door
  city: Paris
  area: Le Marais
  note: >-
    Behind an unmarked red door, with a menu built on French produce. A regular on the World's 50
    Best Bars list.
  map: Little Red Door, 60 Rue Charlot, Paris

- name: Picinin
  city: Milan
  area: Viale Premuda
  note: >-
    A one-man show: the owner runs the bar on his own, and every drink we tried was great.
  map: Picinin cocktail bar, Viale Premuda 7, Milan
