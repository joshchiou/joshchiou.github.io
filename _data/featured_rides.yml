- title: Antibes to Nice coastal ride
  location: "French Riviera"
  date: 2024-09-07
  distance_km: 60
  image: https://github.com/joshchiou/joshchiou.github.io/releases/download/images-v1/bikes-travel-antibes-nice.webp
