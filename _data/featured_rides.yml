- title: Sun Moon Lake loop
  location: "Nantou, Taiwan"
  date: 2024-10-12
  distance_km: 29
  image: https://github.com/joshchiou/joshchiou.github.io/releases/download/images-v1/bikes-travel-sun-moon-lake.webp
