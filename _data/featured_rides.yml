- title: Acadia carriage roads
  location: "Bar Harbor, ME"
  date: 2024-09-01
  distance_km: 18.2
  image: https://github.com/joshchiou/joshchiou.github.io/releases/download/images-v1/bikes-gravel-acadia-carriage-road.webp
  story: "The Around the Mountain Loop — 11.3 miles of car-free crushed-stone carriage road crossing 7 stone bridges through Acadia's interior. The quiet in the park on a fall morning is something else. We bring the Stumpjumpers up every year."

- title: Bangkok bike tour
  location: "Bangkok, Thailand"
  date: 2024-08-17
  distance_km: 70.5
  image: https://github.com/joshchiou/joshchiou.github.io/releases/download/images-v1/bikes-travel-bangkok.webp
  story: "Three laps around the Happy Healthy Bike Lane, a 23.5 km asphalt track on the outskirts of the city. Flat, smooth, and absolutely packed with locals. 95 degrees and worth it."
