- title: Antibes to Nice coastal ride
  location: "French Riviera"
  date: 2024-09-07
  distance_km: 60
  image: https://github.com/joshchiou/joshchiou.github.io/releases/download/images-v1/bikes-travel-antibes-nice.webp
  story: "We rode from Antibes to Nice and back on rented Temple road bikes, along the fully protected coastal path. The Mediterranean was a pretty cerulean, and we spotted a Tour de France commemorative sign in Nice."

- title: Acadia carriage roads
  location: "Bar Harbor, ME"
  date: 2024-09-01
  distance_km: 18.2
  image: https://github.com/joshchiou/joshchiou.github.io/releases/download/images-v1/bikes-gravel-acadia-carriage-road.webp
  story: "The Around the Mountain Loop is an 11.3-mile car-free carriage road around Acadia's interior. The quiet in the park on a fall morning is something else. We try to bring our gravel bikes up every year."

- title: Bangkok bike tour
  location: "Bangkok, Thailand"
  date: 2024-08-17
  distance_km: 70.5
  image: https://github.com/joshchiou/joshchiou.github.io/releases/download/images-v1/bikes-travel-bangkok.webp
  story: "We did three laps of the Happy Healthy Bike Lane, a flat, smooth 14.6-mile asphalt track on the outskirts of the city that's packed with locals. It was over 95°F, but worth it."
