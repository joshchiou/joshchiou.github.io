<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1408"/>
      <stop offset="100%" stop-color="#1f1810"/>
    </linearGradient>
    <linearGradient id="bar5" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="glow5" cx="0.55" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg5)"/>
  <!-- fine grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="0.5">
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
    <line x1="560" y1="0" x2="560" y2="400"/>
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="360" x2="600" y2="360"/>
  </g>
  <!-- ambient glow -->
  <ellipse cx="340" cy="210" rx="260" ry="170" fill="url(#glow5)"/>
  <!-- baseline -->
  <line x1="60" y1="340" x2="560" y2="340" stroke="#f59e0b" stroke-opacity="0.15" stroke-width="1"/>
  <!-- bar chart silhouette (rising trend) -->
  <g fill="url(#bar5)">
    <rect x="80"  y="300" width="30" height="40" rx="2"/>
    <rect x="125" y="285" width="30" height="55" rx="2"/>
    <rect x="170" y="275" width="30" height="65" rx="2"/>
    <rect x="215" y="255" width="30" height="85" rx="2"/>
    <rect x="260" y="240" width="30" height="100" rx="2"/>
    <rect x="305" y="210" width="30" height="130" rx="2"/>
    <rect x="350" y="195" width="30" height="145" rx="2"/>
    <rect x="395" y="165" width="30" height="175" rx="2"/>
    <rect x="440" y="140" width="30" height="200" rx="2"/>
    <rect x="485" y="105" width="30" height="235" rx="2"/>
  </g>
  <!-- bar top highlights -->
  <g fill="#f59e0b">
    <rect x="80"  y="300" width="30" height="2" rx="1" fill-opacity="0.5"/>
    <rect x="125" y="285" width="30" height="2" rx="1" fill-opacity="0.5"/>
    <rect x="170" y="275" width="30" height="2" rx="1" fill-opacity="0.5"/>
    <rect x="215" y="255" width="30" height="2" rx="1" fill-opacity="0.5"/>
    <rect x="260" y="240" width="30" height="2" rx="1" fill-opacity="0.55"/>
    <rect x="305" y="210" width="30" height="2" rx="1" fill-opacity="0.55"/>
    <rect x="350" y="195" width="30" height="2" rx="1" fill-opacity="0.6"/>
    <rect x="395" y="165" width="30" height="2" rx="1" fill-opacity="0.6"/>
    <rect x="440" y="140" width="30" height="2" rx="1" fill-opacity="0.65"/>
    <rect x="485" y="105" width="30" height="2" rx="1" fill-opacity="0.7"/>
  </g>
  <!-- trend line -->
  <polyline points="95,295 140,280 185,268 230,248 275,232 320,202 365,188 410,158 455,132 500,98"
    fill="none" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- trend line data points -->
  <g fill="#f59e0b">
    <circle cx="95"  cy="295" r="3" fill-opacity="0.5"/>
    <circle cx="140" cy="280" r="3" fill-opacity="0.5"/>
    <circle cx="185" cy="268" r="3" fill-opacity="0.55"/>
    <circle cx="230" cy="248" r="3.5" fill-opacity="0.55"/>
    <circle cx="275" cy="232" r="3.5" fill-opacity="0.6"/>
    <circle cx="320" cy="202" r="3.5" fill-opacity="0.6"/>
    <circle cx="365" cy="188" r="4" fill-opacity="0.65"/>
    <circle cx="410" cy="158" r="4" fill-opacity="0.65"/>
    <circle cx="455" cy="132" r="4" fill-opacity="0.7"/>
    <circle cx="500" cy="98" r="4.5" fill-opacity="0.75"/>
  </g>
  <!-- scatter data points (background noise) -->
  <g fill="#f59e0b">
    <circle cx="105" cy="260" r="1.5" fill-opacity="0.2"/>
    <circle cx="150" cy="245" r="1.5" fill-opacity="0.2"/>
    <circle cx="175" cy="230" r="2" fill-opacity="0.22"/>
    <circle cx="250" cy="210" r="1.5" fill-opacity="0.2"/>
    <circle cx="290" cy="195" r="2" fill-opacity="0.22"/>
    <circle cx="340" cy="175" r="1.5" fill-opacity="0.2"/>
    <circle cx="385" cy="145" r="2" fill-opacity="0.22"/>
    <circle cx="430" cy="120" r="1.5" fill-opacity="0.2"/>
    <circle cx="475" cy="85" r="2" fill-opacity="0.25"/>
    <circle cx="520" cy="78" r="1.5" fill-opacity="0.22"/>
  </g>
  <g fill="#d97706">
    <circle cx="120" cy="315" r="1.5" fill-opacity="0.18"/>
    <circle cx="200" cy="280" r="1.5" fill-opacity="0.18"/>
    <circle cx="265" cy="260" r="1.5" fill-opacity="0.18"/>
    <circle cx="335" cy="225" r="1.5" fill-opacity="0.18"/>
    <circle cx="420" cy="180" r="1.5" fill-opacity="0.18"/>
    <circle cx="510" cy="115" r="1.5" fill-opacity="0.2"/>
  </g>
  <!-- scattered upper-area data points -->
  <g fill="#f59e0b">
    <circle cx="130" cy="70" r="1.5" fill-opacity="0.12"/>
    <circle cx="220" cy="85" r="1.5" fill-opacity="0.12"/>
    <circle cx="350" cy="55" r="1.5" fill-opacity="0.15"/>
    <circle cx="480" cy="50" r="2" fill-opacity="0.18"/>
    <circle cx="540" cy="65" r="1.5" fill-opacity="0.15"/>
    <circle cx="70" cy="100" r="1.5" fill-opacity="0.1"/>
    <circle cx="560" cy="130" r="1.5" fill-opacity="0.12"/>
  </g>
  <!-- significance line -->
  <line x1="60" y1="160" x2="560" y2="160" stroke="#d97706" stroke-opacity="0.15" stroke-dasharray="6,4" stroke-width="1"/>
  <!-- glow at top data point -->
  <circle cx="500" cy="98" r="12" fill="#f59e0b" fill-opacity="0.06"/>
  <circle cx="500" cy="98" r="8" fill="#f59e0b" fill-opacity="0.08"/>
</svg>