<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0d1a"/>
      <stop offset="100%" stop-color="#200d18"/>
    </linearGradient>
    <radialGradient id="glow3" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0%" stop-color="#f093fb" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f5576c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg3)"/>
  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="0.5">
    <line x1="60" y1="0" x2="60" y2="400"/><line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="180" y1="0" x2="180" y2="400"/><line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/><line x1="360" y1="0" x2="360" y2="400"/>
    <line x1="420" y1="0" x2="420" y2="400"/><line x1="480" y1="0" x2="480" y2="400"/>
    <line x1="540" y1="0" x2="540" y2="400"/>
    <line x1="0" y1="50" x2="600" y2="50"/><line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="150" x2="600" y2="150"/><line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="250" x2="600" y2="250"/><line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="350" x2="600" y2="350"/>
  </g>
  <!-- ambient glow -->
  <ellipse cx="300" cy="190" rx="260" ry="170" fill="url(#glow3)"/>
  <!-- network edges -->
  <g stroke="#f093fb" stroke-opacity="0.15" stroke-width="1">
    <!-- hub 1 (300,180) connections -->
    <line x1="300" y1="180" x2="140" y2="120"/>
    <line x1="300" y1="180" x2="200" y2="260"/>
    <line x1="300" y1="180" x2="420" y2="130"/>
    <line x1="300" y1="180" x2="450" y2="250"/>
    <line x1="300" y1="180" x2="180" y2="180"/>
    <line x1="300" y1="180" x2="350" y2="300"/>
    <!-- hub 2 (460,200) connections -->
    <line x1="460" y1="200" x2="420" y2="130"/>
    <line x1="460" y1="200" x2="540" y2="140"/>
    <line x1="460" y1="200" x2="520" y2="290"/>
    <line x1="460" y1="200" x2="450" y2="250"/>
    <line x1="460" y1="200" x2="560" y2="220"/>
    <!-- secondary connections -->
    <line x1="140" y1="120" x2="80" y2="80"/>
    <line x1="140" y1="120" x2="100" y2="200"/>
    <line x1="140" y1="120" x2="180" y2="180"/>
    <line x1="200" y1="260" x2="120" y2="310"/>
    <line x1="200" y1="260" x2="250" y2="340"/>
    <line x1="200" y1="260" x2="100" y2="200"/>
    <line x1="420" y1="130" x2="480" y2="70"/>
    <line x1="420" y1="130" x2="360" y2="60"/>
    <line x1="540" y1="140" x2="570" y2="80"/>
    <line x1="520" y1="290" x2="560" y2="340"/>
    <line x1="520" y1="290" x2="450" y2="250"/>
    <line x1="350" y1="300" x2="250" y2="340"/>
    <line x1="350" y1="300" x2="400" y2="360"/>
    <line x1="350" y1="300" x2="450" y2="250"/>
  </g>
  <g stroke="#f5576c" stroke-opacity="0.1" stroke-width="0.8">
    <line x1="80" y1="80" x2="40" y2="50"/>
    <line x1="360" y1="60" x2="280" y2="40"/>
    <line x1="570" y1="80" x2="540" y2="40"/>
    <line x1="120" y1="310" x2="60" y2="350"/>
    <line x1="400" y1="360" x2="460" y2="380"/>
    <line x1="560" y1="340" x2="580" y2="380"/>
  </g>
  <!-- hub nodes (large) -->
  <g>
    <circle cx="300" cy="180" r="10" fill="#f093fb" fill-opacity="0.7"/>
    <circle cx="300" cy="180" r="16" fill="none" stroke="#f093fb" stroke-opacity="0.2" stroke-width="2"/>
    <circle cx="300" cy="180" r="24" fill="none" stroke="#f093fb" stroke-opacity="0.08" stroke-width="1.5"/>
    <circle cx="460" cy="200" r="8" fill="#f5576c" fill-opacity="0.65"/>
    <circle cx="460" cy="200" r="14" fill="none" stroke="#f5576c" stroke-opacity="0.18" stroke-width="1.5"/>
    <circle cx="460" cy="200" r="21" fill="none" stroke="#f5576c" stroke-opacity="0.06" stroke-width="1"/>
  </g>
  <!-- medium nodes -->
  <g>
    <circle cx="140" cy="120" r="6" fill="#f093fb" fill-opacity="0.55"/>
    <circle cx="420" cy="130" r="6" fill="#f5576c" fill-opacity="0.55"/>
    <circle cx="200" cy="260" r="5.5" fill="#f093fb" fill-opacity="0.5"/>
    <circle cx="540" cy="140" r="5" fill="#f5576c" fill-opacity="0.5"/>
    <circle cx="520" cy="290" r="5" fill="#f093fb" fill-opacity="0.45"/>
    <circle cx="350" cy="300" r="5.5" fill="#f5576c" fill-opacity="0.5"/>
    <circle cx="450" cy="250" r="5" fill="#f093fb" fill-opacity="0.45"/>
  </g>
  <!-- small nodes -->
  <g>
    <circle cx="80" cy="80" r="3.5" fill="#f093fb" fill-opacity="0.4"/>
    <circle cx="100" cy="200" r="3.5" fill="#f5576c" fill-opacity="0.35"/>
    <circle cx="180" cy="180" r="3.5" fill="#f093fb" fill-opacity="0.35"/>
    <circle cx="120" cy="310" r="3" fill="#f5576c" fill-opacity="0.35"/>
    <circle cx="250" cy="340" r="3.5" fill="#f093fb" fill-opacity="0.35"/>
    <circle cx="480" cy="70" r="3.5" fill="#f5576c" fill-opacity="0.4"/>
    <circle cx="360" cy="60" r="3" fill="#f093fb" fill-opacity="0.35"/>
    <circle cx="570" cy="80" r="3" fill="#f5576c" fill-opacity="0.35"/>
    <circle cx="560" cy="220" r="3" fill="#f093fb" fill-opacity="0.3"/>
    <circle cx="560" cy="340" r="3" fill="#f5576c" fill-opacity="0.3"/>
    <circle cx="400" cy="360" r="3" fill="#f093fb" fill-opacity="0.3"/>
  </g>
  <!-- tiny peripheral nodes -->
  <g fill="#f093fb">
    <circle cx="40" cy="50" r="2" fill-opacity="0.25"/>
    <circle cx="280" cy="40" r="2" fill-opacity="0.25"/>
    <circle cx="540" cy="40" r="2" fill-opacity="0.2"/>
    <circle cx="60" cy="350" r="2" fill-opacity="0.2"/>
    <circle cx="460" cy="380" r="2" fill-opacity="0.2"/>
    <circle cx="580" cy="380" r="2" fill-opacity="0.15"/>
  </g>
</svg>