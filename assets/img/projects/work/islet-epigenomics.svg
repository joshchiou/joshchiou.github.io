    <radialGradient id="glow2" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0%" stop-color="#00b4d8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0077b6" stop-opacity="0"/>
