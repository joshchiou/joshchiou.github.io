<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="wbg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0d1b2e"/>
      <stop offset="100%" stop-color="#162040"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#wbg)"/>
  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80"  x2="600" y2="80"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="320" x2="600" y2="320"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
  </g>
  <!-- significance threshold -->
  <line x1="0" y1="190" x2="600" y2="190" stroke="#2980b9" stroke-opacity="0.25" stroke-dasharray="8,5" stroke-width="1"/>
  <!-- background scatter (below threshold) -->
  <g fill="#4a8ab5" fill-opacity="0.28">
    <circle cx="38"  cy="308" r="2.5"/><circle cx="68"  cy="290" r="2"/>
    <circle cx="88"  cy="322" r="2"/>  <circle cx="115" cy="278" r="2.5"/>
    <circle cx="145" cy="299" r="2"/>  <circle cx="172" cy="315" r="2"/>
    <circle cx="198" cy="268" r="2"/>  <circle cx="228" cy="308" r="2.5"/>
    <circle cx="258" cy="284" r="2"/>  <circle cx="290" cy="296" r="2"/>
    <circle cx="318" cy="302" r="2"/>  <circle cx="345" cy="282" r="2.5"/>
    <circle cx="370" cy="314" r="2"/>  <circle cx="405" cy="293" r="2"/>
    <circle cx="438" cy="308" r="2.5"/><circle cx="462" cy="278" r="2"/>
    <circle cx="492" cy="304" r="2"/>  <circle cx="528" cy="288" r="2.5"/>
    <circle cx="558" cy="311" r="2"/>  <circle cx="25"  cy="268" r="2"/>
    <circle cx="155" cy="262" r="2"/>  <circle cx="340" cy="256" r="2"/>
    <circle cx="480" cy="265" r="2"/>  <circle cx="580" cy="272" r="2"/>
  </g>
  <!-- network edges -->
  <g stroke="#2980b9" stroke-opacity="0.18" stroke-width="1.2">
    <line x1="62"  y1="148" x2="128" y2="204"/>
    <line x1="128" y1="204" x2="285" y2="122"/>
    <line x1="285" y1="122" x2="405" y2="178"/>
    <line x1="405" y1="178" x2="502" y2="98"/>
    <line x1="502" y1="98"  x2="562" y2="198"/>
    <line x1="128" y1="204" x2="218" y2="298"/>
    <line x1="218" y1="298" x2="382" y2="276"/>
    <line x1="382" y1="276" x2="405" y2="178"/>
    <line x1="285" y1="122" x2="218" y2="298"/>
    <line x1="62"  y1="148" x2="285" y2="122"/>
    <line x1="502" y1="98"  x2="382" y2="276"/>
  </g>
  <!-- network nodes -->
  <g fill="#2980b9">
    <circle cx="62"  cy="148" r="4.5" fill-opacity="0.85"/>
    <circle cx="128" cy="204" r="5"   fill-opacity="0.9"/>
    <circle cx="285" cy="122" r="7.5" fill-opacity="1"/>
    <circle cx="405" cy="178" r="5"   fill-opacity="0.9"/>
    <circle cx="502" cy="98"  r="6.5" fill-opacity="0.9"/>
    <circle cx="218" cy="298" r="4"   fill-opacity="0.8"/>
    <circle cx="382" cy="276" r="4"   fill-opacity="0.8"/>
    <circle cx="562" cy="198" r="4"   fill-opacity="0.8"/>
  </g>
  <!-- glow rings on top hits -->
  <circle cx="285" cy="122" r="12" fill="none" stroke="#2980b9" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="502" cy="98"  r="11" fill="none" stroke="#2980b9" stroke-opacity="0.25" stroke-width="1.5"/>
</svg>
