<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#1a2433"/>
      <stop offset="100%" stop-color="#0d1a26"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="62%" r="42%">
      <stop offset="0%" stop-color="#2980b9" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2980b9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)"/>
  <ellipse cx="300" cy="252" rx="190" ry="105" fill="url(#glow)"/>

  <!-- Ground line -->
  <line x1="85" y1="330" x2="515" y2="330" stroke="#2980b9" stroke-width="1.5" stroke-opacity="0.22"/>

  <!-- === REAR WHEEL === -->
  <circle cx="182" cy="248" r="80" fill="none" stroke="#2980b9" stroke-width="9" stroke-opacity="0.92"/>
  <circle cx="182" cy="248" r="63" fill="none" stroke="#2980b9" stroke-width="2" stroke-opacity="0.3"/>
  <circle cx="182" cy="248" r="9" fill="#0d1a26" stroke="#74add1" stroke-width="3"/>
  <g stroke="#74add1" stroke-width="1.8" stroke-opacity="0.5">
    <line x1="182" y1="248" x2="182" y2="170"/>
    <line x1="182" y1="248" x2="250" y2="209"/>
    <line x1="182" y1="248" x2="250" y2="287"/>
    <line x1="182" y1="248" x2="182" y2="326"/>
    <line x1="182" y1="248" x2="114" y2="287"/>
    <line x1="182" y1="248" x2="114" y2="209"/>
  </g>

  <!-- === FRONT WHEEL === -->
  <circle cx="418" cy="248" r="80" fill="none" stroke="#2980b9" stroke-width="9" stroke-opacity="0.92"/>
  <circle cx="418" cy="248" r="63" fill="none" stroke="#2980b9" stroke-width="2" stroke-opacity="0.3"/>
  <circle cx="418" cy="248" r="9" fill="#0d1a26" stroke="#74add1" stroke-width="3"/>
  <g stroke="#74add1" stroke-width="1.8" stroke-opacity="0.5">
    <line x1="418" y1="248" x2="418" y2="170"/>
    <line x1="418" y1="248" x2="486" y2="209"/>
    <line x1="418" y1="248" x2="486" y2="287"/>
    <line x1="418" y1="248" x2="418" y2="326"/>
    <line x1="418" y1="248" x2="350" y2="287"/>
    <line x1="418" y1="248" x2="350" y2="209"/>
  </g>

  <!-- === FRAME === -->
  <!-- Chain stay: rear axle → BB -->
  <line x1="182" y1="248" x2="300" y2="248" stroke="#74add1" stroke-width="7" stroke-linecap="round"/>
  <!-- Seat tube: BB → seat cluster -->
  <line x1="300" y1="248" x2="268" y2="128" stroke="#74add1" stroke-width="7" stroke-linecap="round"/>
  <!-- Seat stay: rear axle → seat cluster -->
  <line x1="182" y1="248" x2="268" y2="128" stroke="#74add1" stroke-width="5" stroke-linecap="round"/>
  <!-- Top tube: seat cluster → head tube top -->
  <line x1="268" y1="128" x2="384" y2="148" stroke="#74add1" stroke-width="7" stroke-linecap="round"/>
  <!-- Down tube: BB → head tube bottom -->
  <line x1="300" y1="248" x2="396" y2="190" stroke="#74add1" stroke-width="7" stroke-linecap="round"/>
  <!-- Head tube -->
  <line x1="384" y1="148" x2="396" y2="190" stroke="#74add1" stroke-width="11" stroke-linecap="round"/>
  <!-- Fork: head bottom → front axle -->
  <line x1="396" y1="190" x2="418" y2="248" stroke="#74add1" stroke-width="6" stroke-linecap="round"/>

  <!-- === DRIVETRAIN === -->
  <!-- Chainring -->
  <circle cx="300" cy="248" r="28" fill="none" stroke="#74add1" stroke-width="2.5" stroke-opacity="0.55"/>
  <!-- BB shell -->
  <circle cx="300" cy="248" r="13" fill="#0d1a26" stroke="#74add1" stroke-width="3.5"/>
  <!-- Crank arm (right, ~4 o'clock) -->
  <line x1="300" y1="248" x2="320" y2="264" stroke="#74add1" stroke-width="5" stroke-linecap="round"/>
  <!-- Pedal right -->
  <line x1="316" y1="262" x2="329" y2="271" stroke="#74add1" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Crank arm left (opposite) -->
  <line x1="300" y1="248" x2="280" y2="232" stroke="#74add1" stroke-width="5" stroke-linecap="round"/>
  <!-- Chain (dashed arc, rear cassette to chainring) -->
  <path d="M 272 250 Q 228 278 195 254" fill="none" stroke="#74add1" stroke-width="2" stroke-opacity="0.38" stroke-dasharray="5,4"/>

  <!-- === COCKPIT === -->
  <!-- Stem: head tube top → up slightly -->
  <line x1="384" y1="148" x2="390" y2="126" stroke="#a8d4e8" stroke-width="5" stroke-linecap="round"/>
  <!-- Handlebar (drop bar suggestion: bar + drops) -->
  <path d="M 373,122 L 408,122 L 414,140" fill="none" stroke="#a8d4e8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- === SADDLE === -->
  <!-- Seat post extension -->
  <line x1="268" y1="128" x2="266" y2="108" stroke="#a8d4e8" stroke-width="5" stroke-linecap="round"/>
  <!-- Saddle (slight curve) -->
  <path d="M 248,106 Q 267,101 288,105" fill="none" stroke="#a8d4e8" stroke-width="5.5" stroke-linecap="round"/>
</svg>
