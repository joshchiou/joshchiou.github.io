<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2433"/>
      <stop offset="100%" stop-color="#1e2d3d"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#2980b9" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#2980b9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="75%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#3498db" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3498db" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="routeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2980b9" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#3498db" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2980b9" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- ambient glows -->
  <ellipse cx="180" cy="240" rx="260" ry="220" fill="url(#glow1)"/>
  <ellipse cx="450" cy="140" rx="220" ry="200" fill="url(#glow2)"/>
  <!-- dot grid -->
  <g fill="#ffffff" fill-opacity="0.05">
    <circle cx="60" cy="60" r="1.5"/><circle cx="120" cy="60" r="1.5"/><circle cx="180" cy="60" r="1.5"/>
    <circle cx="240" cy="60" r="1.5"/><circle cx="300" cy="60" r="1.5"/><circle cx="360" cy="60" r="1.5"/>
    <circle cx="420" cy="60" r="1.5"/><circle cx="480" cy="60" r="1.5"/><circle cx="540" cy="60" r="1.5"/>
    <circle cx="60" cy="120" r="1.5"/><circle cx="120" cy="120" r="1.5"/><circle cx="180" cy="120" r="1.5"/>
    <circle cx="240" cy="120" r="1.5"/><circle cx="300" cy="120" r="1.5"/><circle cx="360" cy="120" r="1.5"/>
    <circle cx="420" cy="120" r="1.5"/><circle cx="480" cy="120" r="1.5"/><circle cx="540" cy="120" r="1.5"/>
    <circle cx="60" cy="180" r="1.5"/><circle cx="120" cy="180" r="1.5"/><circle cx="180" cy="180" r="1.5"/>
    <circle cx="240" cy="180" r="1.5"/><circle cx="300" cy="180" r="1.5"/><circle cx="360" cy="180" r="1.5"/>
    <circle cx="420" cy="180" r="1.5"/><circle cx="480" cy="180" r="1.5"/><circle cx="540" cy="180" r="1.5"/>
    <circle cx="60" cy="240" r="1.5"/><circle cx="120" cy="240" r="1.5"/><circle cx="180" cy="240" r="1.5"/>
    <circle cx="240" cy="240" r="1.5"/><circle cx="300" cy="240" r="1.5"/><circle cx="360" cy="240" r="1.5"/>
    <circle cx="420" cy="240" r="1.5"/><circle cx="480" cy="240" r="1.5"/><circle cx="540" cy="240" r="1.5"/>
    <circle cx="60" cy="300" r="1.5"/><circle cx="120" cy="300" r="1.5"/><circle cx="180" cy="300" r="1.5"/>
    <circle cx="240" cy="300" r="1.5"/><circle cx="300" cy="300" r="1.5"/><circle cx="360" cy="300" r="1.5"/>
    <circle cx="420" cy="300" r="1.5"/><circle cx="480" cy="300" r="1.5"/><circle cx="540" cy="300" r="1.5"/>
    <circle cx="60" cy="360" r="1.5"/><circle cx="120" cy="360" r="1.5"/><circle cx="180" cy="360" r="1.5"/>
    <circle cx="240" cy="360" r="1.5"/><circle cx="300" cy="360" r="1.5"/><circle cx="360" cy="360" r="1.5"/>
    <circle cx="420" cy="360" r="1.5"/><circle cx="480" cy="360" r="1.5"/><circle cx="540" cy="360" r="1.5"/>
  </g>
  <!-- elevation profile silhouette -->
  <path d="M0 400 L0 340 Q60 330 100 310 Q150 280 180 295 Q220 315 260 270 Q300 230 340 250 Q380 265 420 220 Q460 180 500 200 Q540 215 570 195 L600 190 L600 400 Z" fill="#2980b9" fill-opacity="0.1"/>
  <path d="M0 400 L0 350 Q60 340 100 325 Q150 300 180 310 Q220 325 260 290 Q300 255 340 270 Q380 280 420 245 Q460 210 500 225 Q540 235 570 218 L600 212 L600 400 Z" fill="#3498db" fill-opacity="0.08"/>
  <!-- winding route path -->
  <path d="M40 320 Q100 280 160 300 Q220 320 270 260 Q320 200 370 220 Q420 240 460 180 Q500 120 560 100" fill="none" stroke="url(#routeGrad)" stroke-width="3" stroke-linecap="round"/>
  <!-- route glow -->
  <path d="M40 320 Q100 280 160 300 Q220 320 270 260 Q320 200 370 220 Q420 240 460 180 Q500 120 560 100" fill="none" stroke="#3498db" stroke-opacity="0.15" stroke-width="10" stroke-linecap="round"/>
  <!-- wheel spoke pattern (left) -->
  <circle cx="160" cy="160" r="45" fill="none" stroke="#2980b9" stroke-opacity="0.2" stroke-width="1.5"/>
  <circle cx="160" cy="160" r="46" fill="none" stroke="#3498db" stroke-opacity="0.08" stroke-width="4"/>
  <g stroke="#3498db" stroke-opacity="0.15" stroke-width="0.8">
    <line x1="160" y1="115" x2="160" y2="205"/>
    <line x1="115" y1="160" x2="205" y2="160"/>
    <line x1="128" y1="128" x2="192" y2="192"/>
    <line x1="192" y1="128" x2="128" y2="192"/>
    <line x1="117" y1="145" x2="203" y2="175"/>
    <line x1="117" y1="175" x2="203" y2="145"/>
    <line x1="145" y1="117" x2="175" y2="203"/>
    <line x1="175" y1="117" x2="145" y2="203"/>
  </g>
  <circle cx="160" cy="160" r="5" fill="#2980b9" fill-opacity="0.5"/>
  <!-- wheel spoke pattern (right, smaller) -->
  <circle cx="460" cy="300" r="32" fill="none" stroke="#2980b9" stroke-opacity="0.15" stroke-width="1.2"/>
  <g stroke="#3498db" stroke-opacity="0.1" stroke-width="0.6">
    <line x1="460" y1="268" x2="460" y2="332"/>
    <line x1="428" y1="300" x2="492" y2="300"/>
    <line x1="437" y1="277" x2="483" y2="323"/>
    <line x1="483" y1="277" x2="437" y2="323"/>
  </g>
  <circle cx="460" cy="300" r="3.5" fill="#3498db" fill-opacity="0.4"/>
  <!-- data points scattered along route -->
  <circle cx="160" cy="300" r="4" fill="#3498db" fill-opacity="0.6"/>
  <circle cx="270" cy="260" r="5" fill="#2980b9" fill-opacity="0.65"/>
  <circle cx="370" cy="220" r="4" fill="#3498db" fill-opacity="0.55"/>
  <circle cx="460" cy="180" r="5.5" fill="#2980b9" fill-opacity="0.7"/>
  <circle cx="560" cy="100" r="4.5" fill="#3498db" fill-opacity="0.6"/>
  <!-- data point glow rings -->
  <circle cx="270" cy="260" r="12" fill="none" stroke="#2980b9" stroke-opacity="0.2" stroke-width="1.2"/>
  <circle cx="460" cy="180" r="14" fill="none" stroke="#3498db" stroke-opacity="0.18" stroke-width="1"/>
  <!-- scattered small data dots -->
  <g fill="#3498db" fill-opacity="0.25">
    <circle cx="90" cy="280" r="2"/><circle cx="200" cy="340" r="1.5"/>
    <circle cx="310" cy="190" r="2"/><circle cx="400" cy="160" r="1.5"/>
    <circle cx="520" cy="140" r="2"/><circle cx="130" cy="350" r="1.5"/>
    <circle cx="340" cy="310" r="1.5"/><circle cx="490" cy="260" r="2"/>
    <circle cx="80" cy="200" r="1.5"/><circle cx="530" cy="80" r="1.5"/>
  </g>
  <!-- fine horizontal grid lines suggesting data chart -->
  <g stroke="#3498db" stroke-opacity="0.04" stroke-width="0.5">
    <line x1="40" y1="140" x2="560" y2="140"/>
    <line x1="40" y1="200" x2="560" y2="200"/>
    <line x1="40" y1="260" x2="560" y2="260"/>
    <line x1="40" y1="320" x2="560" y2="320"/>
  </g>
</svg>
