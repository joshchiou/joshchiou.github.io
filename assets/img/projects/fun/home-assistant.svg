<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2a24"/>
      <stop offset="100%" stop-color="#1e3329"/>
    </linearGradient>
    <radialGradient id="glow1" cx="45%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#00b894" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00b894" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="70%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#55efc4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#55efc4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="20%" cy="70%" r="35%">
      <stop offset="0%" stop-color="#00b894" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#00b894" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#55efc4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#55efc4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- ambient glows -->
  <ellipse cx="270" cy="160" rx="280" ry="240" fill="url(#glow1)"/>
  <ellipse cx="420" cy="260" rx="220" ry="190" fill="url(#glow2)"/>
  <ellipse cx="120" cy="280" rx="180" ry="150" fill="url(#glow3)"/>
  <!-- dot grid -->
  <g fill="#ffffff" fill-opacity="0.05">
    <circle cx="60" cy="60" r="1.5"/><circle cx="120" cy="60" r="1.5"/><circle cx="180" cy="60" r="1.5"/>
    <circle cx="240" cy="60" r="1.5"/><circle cx="300" cy="60" r="1.5"/><circle cx="360" cy="60" r="1.5"/>
    <circle cx="420" cy="60" r="1.5"/><circle cx="480" cy="60" r="1.5"/><circle cx="540" cy="60" r="1.5"/>
    <circle cx="60" cy="120" r="1.5"/><circle cx="120" cy="120" r="1.5"/><circle cx="180" cy="120" r="1.5"/>
    <circle cx="240" cy="120" r="1.5"/><circle cx="300" cy="120" r="1.5"/><circle cx="360" cy="120" r="1.5"/>
    <circle cx="420" cy="120" r="1.5"/><circle cx="480" cy="120" r="1.5"/><circle cx="540" cy="120" r="1.5"/>
    <circle cx="60" cy="180" r="1.5"/><circle cx="120" cy="180" r="1.5"/><circle cx="180" cy="180" r="1.5"/>
    <circle cx="240" cy="180" r="1.5"/><circle cx="300" cy="180" r="1.5"/><circle cx="360" cy="180" r="1.5"/>
    <circle cx="420" cy="180" r="1.5"/><circle cx="480" cy="180" r="1.5"/><circle cx="540" cy="180" r="1.5"/>
    <circle cx="60" cy="240" r="1.5"/><circle cx="120" cy="240" r="1.5"/><circle cx="180" cy="240" r="1.5"/>
    <circle cx="240" cy="240" r="1.5"/><circle cx="300" cy="240" r="1.5"/><circle cx="360" cy="240" r="1.5"/>
    <circle cx="420" cy="240" r="1.5"/><circle cx="480" cy="240" r="1.5"/><circle cx="540" cy="240" r="1.5"/>
    <circle cx="60" cy="300" r="1.5"/><circle cx="120" cy="300" r="1.5"/><circle cx="180" cy="300" r="1.5"/>
    <circle cx="240" cy="300" r="1.5"/><circle cx="300" cy="300" r="1.5"/><circle cx="360" cy="300" r="1.5"/>
    <circle cx="420" cy="300" r="1.5"/><circle cx="480" cy="300" r="1.5"/><circle cx="540" cy="300" r="1.5"/>
    <circle cx="60" cy="360" r="1.5"/><circle cx="120" cy="360" r="1.5"/><circle cx="180" cy="360" r="1.5"/>
    <circle cx="240" cy="360" r="1.5"/><circle cx="300" cy="360" r="1.5"/><circle cx="360" cy="360" r="1.5"/>
    <circle cx="420" cy="360" r="1.5"/><circle cx="480" cy="360" r="1.5"/><circle cx="540" cy="360" r="1.5"/>
  </g>
  <!-- circuit board traces -->
  <g stroke="#00b894" stroke-opacity="0.15" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- horizontal traces -->
    <path d="M80 160 L180 160 L200 140 L350 140"/>
    <path d="M100 240 L200 240 L220 220 L300 220"/>
    <path d="M350 280 L430 280 L450 260 L540 260"/>
    <path d="M380 180 L450 180 L470 200 L530 200"/>
    <!-- vertical traces -->
    <path d="M200 100 L200 140"/>
    <path d="M350 90 L350 140 L350 180"/>
    <path d="M450 180 L450 140 L450 100"/>
    <path d="M300 220 L300 280 L300 320"/>
    <path d="M530 200 L530 260"/>
  </g>
  <!-- additional fine circuit traces -->
  <g stroke="#55efc4" stroke-opacity="0.08" stroke-width="0.7" fill="none" stroke-linecap="round">
    <path d="M120 320 L180 320 L200 300"/>
    <path d="M420 120 L480 120 L500 100"/>
    <path d="M150 90 L150 130"/>
    <path d="M480 300 L480 340 L520 340"/>
  </g>
  <!-- house outline (centered) -->
  <g transform="translate(280, 175)">
    <!-- roof -->
    <path d="M-60 0 L0 -55 L60 0" fill="none" stroke="#00b894" stroke-opacity="0.45" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- walls -->
    <path d="M-50 0 L-50 50 L50 50 L50 0" fill="#00b894" fill-opacity="0.05" stroke="#00b894" stroke-opacity="0.35" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- door -->
    <rect x="-10" y="20" width="20" height="30" rx="2" fill="#00b894" fill-opacity="0.08" stroke="#55efc4" stroke-opacity="0.25" stroke-width="1"/>
    <!-- window left -->
    <rect x="-40" y="12" width="18" height="16" rx="2" fill="#55efc4" fill-opacity="0.1" stroke="#55efc4" stroke-opacity="0.2" stroke-width="0.8"/>
    <!-- window right -->
    <rect x="22" y="12" width="18" height="16" rx="2" fill="#55efc4" fill-opacity="0.1" stroke="#55efc4" stroke-opacity="0.2" stroke-width="0.8"/>
    <!-- roof glow -->
    <path d="M-58 2 L0 -53 L58 2" fill="none" stroke="#55efc4" stroke-opacity="0.1" stroke-width="5"/>
  </g>
  <!-- connection nodes (circuit intersections) -->
  <g>
    <circle cx="200" cy="140" r="4" fill="#00b894" fill-opacity="0.6"/>
    <circle cx="200" cy="140" r="9" fill="none" stroke="#00b894" stroke-opacity="0.2" stroke-width="1"/>
    <circle cx="350" cy="140" r="4.5" fill="#55efc4" fill-opacity="0.5"/>
    <circle cx="350" cy="140" r="10" fill="none" stroke="#55efc4" stroke-opacity="0.18" stroke-width="1"/>
    <circle cx="300" cy="220" r="3.5" fill="#00b894" fill-opacity="0.55"/>
    <circle cx="300" cy="220" r="8" fill="none" stroke="#00b894" stroke-opacity="0.15" stroke-width="1"/>
    <circle cx="450" cy="180" r="3.5" fill="#55efc4" fill-opacity="0.5"/>
    <circle cx="450" cy="260" r="4" fill="#00b894" fill-opacity="0.55"/>
    <circle cx="450" cy="260" r="9" fill="none" stroke="#00b894" stroke-opacity="0.18" stroke-width="1"/>
    <circle cx="530" cy="200" r="3" fill="#55efc4" fill-opacity="0.45"/>
    <circle cx="300" cy="320" r="3" fill="#00b894" fill-opacity="0.4"/>
  </g>
  <!-- small connection node dots -->
  <g fill="#55efc4" fill-opacity="0.3">
    <circle cx="180" cy="160" r="2"/><circle cx="100" cy="240" r="2"/>
    <circle cx="200" cy="100" r="2"/><circle cx="350" cy="90" r="2"/>
    <circle cx="450" cy="100" r="2"/><circle cx="530" cy="260" r="2"/>
    <circle cx="120" cy="320" r="1.8"/><circle cx="480" cy="120" r="1.8"/>
    <circle cx="480" cy="300" r="1.8"/><circle cx="520" cy="340" r="1.8"/>
  </g>
  <!-- WiFi arcs (upper right) -->
  <g transform="translate(490, 80)" stroke="#55efc4" fill="none" stroke-linecap="round">
    <path d="M-12 8 Q0 -4 12 8" stroke-opacity="0.35" stroke-width="1.5"/>
    <path d="M-20 14 Q0 -10 20 14" stroke-opacity="0.25" stroke-width="1.3"/>
    <path d="M-28 20 Q0 -16 28 20" stroke-opacity="0.15" stroke-width="1.1"/>
    <circle cx="0" cy="12" r="2.5" fill="#55efc4" fill-opacity="0.5"/>
  </g>
  <!-- WiFi arcs (lower left, smaller) -->
  <g transform="translate(100, 340)" stroke="#00b894" fill="none" stroke-linecap="round">
    <path d="M-8 6 Q0 -2 8 6" stroke-opacity="0.25" stroke-width="1.2"/>
    <path d="M-14 10 Q0 -6 14 10" stroke-opacity="0.15" stroke-width="1"/>
    <circle cx="0" cy="8" r="2" fill="#00b894" fill-opacity="0.4"/>
  </g>
  <!-- decorative scattered dots -->
  <g fill="#00b894" fill-opacity="0.15">
    <circle cx="70" cy="80" r="1.5"/><circle cx="540" cy="350" r="1.5"/>
    <circle cx="160" cy="370" r="1.5"/><circle cx="400" cy="70" r="1.5"/>
    <circle cx="550" cy="130" r="1.5"/><circle cx="60" cy="200" r="1.5"/>
  </g>
</svg>
