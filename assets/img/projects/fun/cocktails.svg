<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a1a1a"/>
      <stop offset="100%" stop-color="#302020"/>
    </linearGradient>
    <radialGradient id="glow1" cx="40%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#e17055" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#e17055" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="70%" cy="60%" r="45%">
      <stop offset="0%" stop-color="#fdcb6e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fdcb6e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="20%" cy="75%" r="35%">
      <stop offset="0%" stop-color="#e17055" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#e17055" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="liquidGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e17055" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fdcb6e" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- ambient glows -->
  <ellipse cx="240" cy="180" rx="260" ry="230" fill="url(#glow1)"/>
  <ellipse cx="420" cy="240" rx="220" ry="200" fill="url(#glow2)"/>
  <ellipse cx="120" cy="300" rx="180" ry="160" fill="url(#glow3)"/>
  <!-- dot grid -->
  <g fill="#ffffff" fill-opacity="0.05">
    <circle cx="60" cy="60" r="1.5"/><circle cx="120" cy="60" r="1.5"/><circle cx="180" cy="60" r="1.5"/>
    <circle cx="240" cy="60" r="1.5"/><circle cx="300" cy="60" r="1.5"/><circle cx="360" cy="60" r="1.5"/>
    <circle cx="420" cy="60" r="1.5"/><circle cx="480" cy="60" r="1.5"/><circle cx="540" cy="60" r="1.5"/>
    <circle cx="60" cy="120" r="1.5"/><circle cx="120" cy="120" r="1.5"/><circle cx="180" cy="120" r="1.5"/>
    <circle cx="240" cy="120" r="1.5"/><circle cx="300" cy="120" r="1.5"/><circle cx="360" cy="120" r="1.5"/>
    <circle cx="420" cy="120" r="1.5"/><circle cx="480" cy="120" r="1.5"/><circle cx="540" cy="120" r="1.5"/>
    <circle cx="60" cy="180" r="1.5"/><circle cx="120" cy="180" r="1.5"/><circle cx="180" cy="180" r="1.5"/>
    <circle cx="240" cy="180" r="1.5"/><circle cx="300" cy="180" r="1.5"/><circle cx="360" cy="180" r="1.5"/>
    <circle cx="420" cy="180" r="1.5"/><circle cx="480" cy="180" r="1.5"/><circle cx="540" cy="180" r="1.5"/>
    <circle cx="60" cy="240" r="1.5"/><circle cx="120" cy="240" r="1.5"/><circle cx="180" cy="240" r="1.5"/>
    <circle cx="240" cy="240" r="1.5"/><circle cx="300" cy="240" r="1.5"/><circle cx="360" cy="240" r="1.5"/>
    <circle cx="420" cy="240" r="1.5"/><circle cx="480" cy="240" r="1.5"/><circle cx="540" cy="240" r="1.5"/>
    <circle cx="60" cy="300" r="1.5"/><circle cx="120" cy="300" r="1.5"/><circle cx="180" cy="300" r="1.5"/>
    <circle cx="240" cy="300" r="1.5"/><circle cx="300" cy="300" r="1.5"/><circle cx="360" cy="300" r="1.5"/>
    <circle cx="420" cy="300" r="1.5"/><circle cx="480" cy="300" r="1.5"/><circle cx="540" cy="300" r="1.5"/>
    <circle cx="60" cy="360" r="1.5"/><circle cx="120" cy="360" r="1.5"/><circle cx="180" cy="360" r="1.5"/>
    <circle cx="240" cy="360" r="1.5"/><circle cx="300" cy="360" r="1.5"/><circle cx="360" cy="360" r="1.5"/>
    <circle cx="420" cy="360" r="1.5"/><circle cx="480" cy="360" r="1.5"/><circle cx="540" cy="360" r="1.5"/>
  </g>
  <!-- coupe glass silhouette (geometric) -->
  <g transform="translate(280, 100)">
    <!-- bowl - wide shallow curve -->
    <path d="M-70 80 Q-70 10 0 0 Q70 10 70 80 Z" fill="url(#liquidGrad)"/>
    <path d="M-70 80 Q-70 10 0 0 Q70 10 70 80 Z" fill="none" stroke="#e17055" stroke-opacity="0.4" stroke-width="1.5"/>
    <!-- stem -->
    <line x1="0" y1="80" x2="0" y2="180" stroke="#e17055" stroke-opacity="0.35" stroke-width="1.5"/>
    <!-- base -->
    <ellipse cx="0" cy="180" rx="35" ry="6" fill="none" stroke="#e17055" stroke-opacity="0.3" stroke-width="1.5"/>
    <!-- liquid level shimmer -->
    <path d="M-55 55 Q-20 48 0 52 Q30 56 55 50" fill="none" stroke="#fdcb6e" stroke-opacity="0.3" stroke-width="1"/>
    <!-- glass rim highlight -->
    <path d="M-68 78 Q-68 12 0 2 Q68 12 68 78" fill="none" stroke="#fdcb6e" stroke-opacity="0.12" stroke-width="0.8"/>
  </g>
  <!-- citrus wedge circle (upper right) -->
  <g transform="translate(460, 110)">
    <circle cx="0" cy="0" r="30" fill="#fdcb6e" fill-opacity="0.12" stroke="#fdcb6e" stroke-opacity="0.3" stroke-width="1.2"/>
    <!-- segments -->
    <line x1="0" y1="-28" x2="0" y2="28" stroke="#fdcb6e" stroke-opacity="0.15" stroke-width="0.7"/>
    <line x1="-28" y1="0" x2="28" y2="0" stroke="#fdcb6e" stroke-opacity="0.15" stroke-width="0.7"/>
    <line x1="-20" y1="-20" x2="20" y2="20" stroke="#fdcb6e" stroke-opacity="0.12" stroke-width="0.7"/>
    <line x1="20" y1="-20" x2="-20" y2="20" stroke="#fdcb6e" stroke-opacity="0.12" stroke-width="0.7"/>
    <circle cx="0" cy="0" r="5" fill="#fdcb6e" fill-opacity="0.2"/>
    <!-- glow ring -->
    <circle cx="0" cy="0" r="38" fill="none" stroke="#fdcb6e" stroke-opacity="0.1" stroke-width="3"/>
  </g>
  <!-- smaller citrus slice (lower left) -->
  <g transform="translate(110, 280)">
    <circle cx="0" cy="0" r="20" fill="#e17055" fill-opacity="0.1" stroke="#e17055" stroke-opacity="0.25" stroke-width="1"/>
    <line x1="0" y1="-18" x2="0" y2="18" stroke="#e17055" stroke-opacity="0.12" stroke-width="0.6"/>
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#e17055" stroke-opacity="0.12" stroke-width="0.6"/>
    <line x1="-13" y1="-13" x2="13" y2="13" stroke="#e17055" stroke-opacity="0.1" stroke-width="0.6"/>
    <line x1="13" y1="-13" x2="-13" y2="13" stroke="#e17055" stroke-opacity="0.1" stroke-width="0.6"/>
  </g>
  <!-- ice cube shapes -->
  <g transform="translate(440, 280)">
    <rect x="-22" y="-22" width="44" height="44" rx="6" fill="#fdcb6e" fill-opacity="0.08" stroke="#fdcb6e" stroke-opacity="0.2" stroke-width="1"/>
    <rect x="-16" y="-16" width="32" height="32" rx="4" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="0.5"/>
    <!-- highlight -->
    <line x1="-14" y1="-18" x2="-6" y2="-18" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" stroke-linecap="round"/>
  </g>
  <g transform="translate(500, 310)">
    <rect x="-16" y="-16" width="32" height="32" rx="5" fill="#e17055" fill-opacity="0.06" stroke="#e17055" stroke-opacity="0.15" stroke-width="0.8"/>
    <line x1="-10" y1="-13" x2="-4" y2="-13" stroke="#ffffff" stroke-opacity="0.08" stroke-width="0.8" stroke-linecap="round"/>
  </g>
  <!-- ice cube top-left area -->
  <g transform="translate(160, 140) rotate(15)">
    <rect x="-14" y="-14" width="28" height="28" rx="4" fill="#fdcb6e" fill-opacity="0.06" stroke="#fdcb6e" stroke-opacity="0.12" stroke-width="0.8"/>
  </g>
  <!-- liquid pour curves -->
  <path d="M340 80 Q345 60 350 50 Q358 35 355 20" fill="none" stroke="#e17055" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round"/>
  <path d="M342 80 Q348 55 355 42 Q362 28 358 12" fill="none" stroke="#fdcb6e" stroke-opacity="0.12" stroke-width="4" stroke-linecap="round"/>
  <!-- bubble accents -->
  <circle cx="260" cy="140" r="3" fill="#fdcb6e" fill-opacity="0.35"/>
  <circle cx="300" cy="125" r="2.5" fill="#e17055" fill-opacity="0.4"/>
  <circle cx="310" cy="150" r="2" fill="#fdcb6e" fill-opacity="0.3"/>
  <circle cx="275" cy="160" r="1.8" fill="#e17055" fill-opacity="0.25"/>
  <circle cx="295" cy="145" r="1.5" fill="#fdcb6e" fill-opacity="0.2"/>
  <!-- decorative accent dots -->
  <g fill="#e17055" fill-opacity="0.2">
    <circle cx="80" cy="80" r="2"/><circle cx="530" cy="200" r="2.5"/>
    <circle cx="70" cy="350" r="1.8"/><circle cx="540" cy="370" r="2"/>
    <circle cx="200" cy="350" r="1.5"/><circle cx="380" cy="340" r="1.5"/>
  </g>
  <g fill="#fdcb6e" fill-opacity="0.15">
    <circle cx="510" cy="70" r="2"/><circle cx="90" cy="180" r="2"/>
    <circle cx="350" cy="360" r="1.8"/><circle cx="480" cy="160" r="1.5"/>
  </g>
  <!-- glow ring accents -->
  <circle cx="260" cy="140" r="8" fill="none" stroke="#fdcb6e" stroke-opacity="0.15" stroke-width="1"/>
  <circle cx="300" cy="125" r="7" fill="none" stroke="#e17055" stroke-opacity="0.12" stroke-width="0.8"/>
</svg>
