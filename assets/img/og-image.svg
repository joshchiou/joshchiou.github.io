<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Source for og-image.png (the link preview). Edit here, then run: python3 scripts/render_og_image.py
       The photo is prof_pic.jpg next to this file; the script embeds it when rendering. No counts on
       the card: link previews are cached for weeks and numbers go stale. -->
  <defs>
    <clipPath id="photo">
      <circle cx="300" cy="315" r="190" />
    </clipPath>
  </defs>
  <rect width="1200" height="630" fill="#ffffff" />

  <image href="prof_pic.jpg" x="110" y="125" width="380" height="380" clip-path="url(#photo)" preserveAspectRatio="xMidYMid slice" />
  <circle cx="300" cy="315" r="190" fill="none" stroke="#e3e3e3" stroke-width="2" />

  <g font-family="Inter, 'DejaVu Sans', sans-serif">
    <text x="570" y="282" font-size="66" font-weight="700" fill="#111111" letter-spacing="-1.3">Joshua Chiou</text>
    <text x="570" y="336" font-size="30" font-weight="400" fill="#333333">Director, Genomics · Lilly</text>
    <text x="570" y="380" font-size="22" font-weight="400" fill="#6b6b6b">Translational Proteomics &amp; Statistical Genetics</text>
    <text x="570" y="452" font-size="22" font-weight="600" fill="#1d6aa5">joshchiou.github.io</text>
  </g>
</svg>
